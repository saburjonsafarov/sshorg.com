name: Projection compositor diagnostic
on:
  push:
    branches: ['fix/webkit-camera-projection']
    paths: ['tests/projection-diagnostic.py', '.github/workflows/projection-diagnostic.yml']
permissions:
  contents: read
jobs:
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps webkit
      - run: python tests/projection-diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projection-compositor
          path: test-results/projection/
          retention-days: 7
