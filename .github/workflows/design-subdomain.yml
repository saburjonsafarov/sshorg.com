name: Design subdomain (Caddy)

# Разовая настройка: design.sshorg.com отдаёт site/design/ (документация SSH Design System).
# Запускается вручную после того, как A-запись design → сервер появилась в DNS.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the Caddy change (false = inspect only)"
        type: boolean
        default: false

jobs:
  caddy:
    runs-on: ubuntu-latest
    steps:
      - name: Check DNS
        run: |
          ip=$(dig +short design.sshorg.com A | tail -1)
          echo "design.sshorg.com -> ${ip:-<none>}"
          test -n "$ip"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Inspect server (read-only)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_HOST }}" DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' 'bash -s' <<'REMOTE'
          echo "whoami: $(whoami)"
          echo "deploy path: $DEPLOY_PATH -> $(readlink -f "$DEPLOY_PATH")"
          ls -la "$DEPLOY_PATH/design" 2>&1 | head -5
          echo "caddy bin: $(command -v caddy || echo none)"
          systemctl is-active caddy 2>&1 || true
          systemctl cat caddy 2>/dev/null | grep -E 'ExecStart|ExecReload' || true
          ls -la /etc/caddy 2>&1 | head
          command -v docker >/dev/null && docker ps --format '{{.Names}} {{.Image}} {{.Mounts}}' 2>&1 | grep -i caddy || echo "no caddy container"
          grep -rlE 'sshorg\.com' /etc/caddy 2>/dev/null || true
          C=$(docker ps --format '{{.Names}}' | grep -i caddy | head -1)
          if [ -n "$C" ]; then
            echo "== container $C mounts"
            docker inspect "$C" --format '{{range .Mounts}}{{.Type}} {{.Source}} -> {{.Destination}}{{println}}{{end}}'
            echo "== compose project"
            docker inspect "$C" --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}} {{index .Config.Labels "com.docker.compose.project.config_files"}}'
            echo "== Caddyfile in container"
            docker exec "$C" cat /etc/caddy/Caddyfile 2>&1 | sed -n '1,120p'
          fi
          REMOTE

      - name: Add site block, validate, reload
        if: ${{ inputs.apply }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          # Caddy работает в контейнере проекта Sartarosh; Caddyfile примонтирован с хоста,
          # каталог сайта sshorg.com виден в контейнере как /srv/sshorg.
          C=sartarosh-caddy-1
          CF=/root/Sartarosh/Caddyfile
          test -f "$CF" || { echo "no $CF"; exit 1; }
          git -C /root/Sartarosh status --short -- Caddyfile 2>/dev/null || true
          if grep -q '^design\.sshorg\.com' "$CF"; then echo "block already present"; exit 0; fi
          docker exec "$C" test -f /srv/sshorg/design/index.html || { echo "no /srv/sshorg/design/index.html in $C"; exit 1; }
          BAK="$CF.bak-design-$(date +%Y%m%d%H%M%S)"
          cp "$CF" "$BAK"
          cat >> "$CF" <<'BLOCK'

          # SSH Design System docs (sshorg.com repo, site/design/).
          design.sshorg.com {
          	root * /srv/sshorg/design
          	encode zstd gzip
          	header {
          		Strict-Transport-Security "max-age=31536000"
          		X-Content-Type-Options "nosniff"
          		Referrer-Policy "strict-origin-when-cross-origin"
          		-Server
          	}
          	file_server
          }
          BLOCK
          if ! docker exec "$C" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
            cat "$BAK" > "$CF"
            echo "validate failed, restored $BAK"; exit 1
          fi
          docker exec "$C" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "reloaded; backup at $BAK"
          REMOTE

      - name: Smoke check
        if: ${{ inputs.apply }}
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://design.sshorg.com/ || true)
            echo "try $i: $code"; [ "$code" = 200 ] && exit 0; sleep 10
          done
          exit 1
