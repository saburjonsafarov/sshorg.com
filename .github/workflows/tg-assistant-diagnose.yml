name: Diagnose tg-assistant

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tg-assistant-diagnose.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts

      - name: Diagnose runtime
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          echo "== container =="
          docker inspect -f 'status={{.State.Status}} running={{.State.Running}} restart={{.RestartCount}} started={{.State.StartedAt}}' tg-assistant || true

          echo "== compose =="
          cd /opt/tg-assistant
          BRAIN_HOST_PATH=/opt/brain docker compose ps

          echo "== env keys =="
          grep -E '^(OWNER_TELEGRAM_ID|GIT_PUSH_ENABLED|LOG_RAW_UPDATES|CLAUDE_MODEL|HISTORY_TURNS)=' .env || true

          echo "== telegram identity =="
          token=$(grep '^TELEGRAM_BOT_TOKEN=' .env | cut -d= -f2-)
          curl -fsS --max-time 10 "https://api.telegram.org/bot${token}/getMe"             | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print("username="+str(r.get("username"))); print("id="+str(r.get("id"))); print("can_connect_to_business="+str(r.get("can_connect_to_business"))); print("has_main_web_app="+str(r.get("has_main_web_app")))'

          echo "== webhook =="
          curl -fsS --max-time 10 "https://api.telegram.org/bot${token}/getWebhookInfo"             | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print("url="+str(r.get("url"))); print("pending_update_count="+str(r.get("pending_update_count"))); print("last_error_message="+str(r.get("last_error_message")))'

          echo "== recent logs =="
          docker logs --since 15m --tail 200 tg-assistant 2>&1             | sed -E 's/[0-9]{7,12}:[A-Za-z0-9_-]{20,}/[REDACTED_TOKEN]/g'

          echo "== memory files =="
          find /opt/brain/telegram -maxdepth 2 -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %p\n' 2>/dev/null | sort | tail -40 || true
          REMOTE
