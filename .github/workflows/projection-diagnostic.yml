name: Projection verification before PR
on:
  push:
    branches: ['fix/webkit-camera-projection']
    paths: ['site/experience.js', 'tests/**', '.github/workflows/projection-diagnostic.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
  browsers:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/camera-browser.py
        env:
          BROWSER: ${{ matrix.browser }}
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
