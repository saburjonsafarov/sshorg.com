name: Recover tg-assistant

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tg-assistant-recover.yml"

concurrency:
  group: tg-assistant-recover
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts

      - name: Replace stale container and start
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          test -s /opt/tg-assistant/.env
          test -f /opt/tg-assistant/docker-compose.yml
          test -d /opt/brain

          cd /opt/tg-assistant
          BRAIN_HOST_PATH=/opt/brain docker compose down --remove-orphans || true
          docker ps -aq --filter "name=tg-assistant" | xargs -r docker rm -f

          BRAIN_HOST_PATH=/opt/brain docker compose up -d --build tg-assistant

          sleep 12
          test "$(docker inspect -f '{{.State.Running}}' tg-assistant)" = "true"
          test "$(docker inspect -f '{{.RestartCount}}' tg-assistant)" = "0"

          docker logs --tail 120 tg-assistant > /tmp/tg-assistant-last.log 2>&1
          grep -q 'бот @saburjonsafarovsbot запущен' /tmp/tg-assistant-last.log

          if grep -qi 'Conflict: terminated by other getUpdates request' /tmp/tg-assistant-last.log; then
            echo "Telegram getUpdates conflict detected"
            exit 44
          fi

          echo "TG_ASSISTANT_RUNNING"
          docker inspect -f 'status={{.State.Status}} restart={{.RestartCount}}' tg-assistant
          REMOTE
