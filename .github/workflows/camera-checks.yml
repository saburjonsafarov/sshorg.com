name: Camera scene checks

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/camera-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check site/experience.js
      - run: node --test tests/*.test.cjs

  browsers:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Verify production DOM, viewport matrix, and fallbacks
        run: python tests/camera-browser.py
        env:
          BROWSER: ${{ matrix.browser }}
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
