name: Fix tg-assistant owner chat

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tg-assistant-owner-fix.yml"

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts

      - name: Patch owner message handling
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$DEPLOY_HOST" 'python3 -' <<'PY'
          from pathlib import Path

          path = Path("/opt/tg-assistant/tg_assistant/app.py")
          text = path.read_text(encoding="utf-8")

          marker = '        command = parse_owner_command(update, self._config.owner_id)\n'
          if "обычный message update" not in text:
              if marker not in text:
                  raise SystemExit("owner command marker not found")
              insertion = (
                  '        message = update.get("message")\n'
                  '        if isinstance(message, dict):\n'
                  '            sender = message.get("from")\n'
                  '            chat = message.get("chat")\n'
                  '            sender_id = sender.get("id") if isinstance(sender, dict) else None\n'
                  '            chat_id = chat.get("id") if isinstance(chat, dict) else None\n'
                  '            log.info(\n'
                  '                "обычный message update: sender_id=%s chat_id=%s authorized=%s",\n'
                  '                sender_id,\n'
                  '                chat_id,\n'
                  '                sender_id == self._config.owner_id,\n'
                  '            )\n\n'
              )
              text = text.replace(marker, insertion + marker, 1)

          contact_marker = '            await self._tell_owner("Контакты:\\n" + "\\n".join(lines))\n'
          if "Не понял команду." not in text:
              if contact_marker not in text:
                  raise SystemExit("contacts marker not found")
              fallback = (
                  contact_marker
                  + '        else:\n'
                  + '            await self._tell_owner(\n'
                  + '                "Не понял команду. Напиши /help — покажу доступные команды."\n'
                  + '            )\n'
              )
              text = text.replace(contact_marker, fallback, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Rebuild and verify
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key "$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/tg-assistant
          BRAIN_HOST_PATH=/opt/brain docker compose up -d --build tg-assistant
          sleep 8
          test "$(docker inspect -f '{{.State.Running}}' tg-assistant)" = "true"
          grep -q 'обычный message update' tg_assistant/app.py
          grep -q 'Не понял команду' tg_assistant/app.py
          echo "OWNER_CHAT_FIX_DEPLOYED"
          REMOTE
