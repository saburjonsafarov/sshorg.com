name: Design headers (Caddy)

# design.sshorg.com: заголовки безопасности (CSP и др.) и страница 404 из deploy/design.Caddyfile.
# Caddy общий с другими сайтами (контейнер Sartarosh): меняется только блок design.sshorg.com,
# бэкап → validate → graceful reload; при ошибке или если другой сайт сменил код ответа — откат.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect | report-only | enforce | rollback"
        type: choice
        options: [inspect, report-only, enforce, rollback]
        default: inspect

jobs:
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Sites on this Caddy (before)
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_HOST }}" 'cat /root/Sartarosh/Caddyfile' > Caddyfile.server
          grep -oE '^[a-zA-Z0-9*.,: -]+\{' Caddyfile.server | tr ', ' '\n\n' | grep -E '^[a-z0-9-]+(\.[a-z0-9-]+)+$' | sort -u > hosts.txt
          echo "== hosts"; cat hosts.txt
          while read -r h; do echo "$h $(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$h/" || echo ERR)"; done < hosts.txt | tee before.txt
          echo "== current design block"
          awk '/^# >>> design\.sshorg\.com/{p=1} /^design\.sshorg\.com[ {]/{p=1} p{print} p&&(/^}/||/^# <<< design\.sshorg\.com/){if(/^# <<</||!/^# >>>/)p=0}' Caddyfile.server

      - name: Apply block
        if: ${{ inputs.mode != 'inspect' }}
        run: |
          case "${{ inputs.mode }}" in
            report-only) NAME=Content-Security-Policy-Report-Only ;;
            enforce|rollback) NAME=Content-Security-Policy ;;
          esac
          sed "s/__CSP_HEADER__/$NAME/g" deploy/design.Caddyfile > block.caddy
          scp -i ~/.ssh/deploy_key block.caddy "${{ secrets.DEPLOY_HOST }}:/tmp/design-block.caddy"
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_HOST }}" MODE='${{ inputs.mode }}' 'bash -s' <<'REMOTE'
          set -euo pipefail
          C=sartarosh-caddy-1
          CF=/root/Sartarosh/Caddyfile
          docker exec "$C" caddy version
          if [ "$MODE" = rollback ]; then
            BAK=$(ls -1t "$CF".bak-design-* | head -1)
            echo "rollback to $BAK"; cat "$BAK" > "$CF"
          else
            BAK="$CF.bak-design-$(date +%Y%m%d%H%M%S)"
            cp -p "$CF" "$BAK"
            # Убрать прежний блок design.sshorg.com (с маркерами или без), остальное — байт в байт
            awk '
              /^# >>> design\.sshorg\.com/ { skip = 2; next }
              skip == 2 { if (/^# <<< design\.sshorg\.com/) skip = 0; next }
              /^# SSH Design System docs/ { held = $0; next }
              /^design\.sshorg\.com[ {]/ { skip = 1; held = ""; next }
              skip == 1 { if (/^}/) skip = 0; next }
              { if (held != "") { print held; held = "" } print }
            ' "$BAK" > /tmp/Caddyfile.new
            if grep -q 'design\.sshorg\.com' /tmp/Caddyfile.new; then echo "old design block not fully removed"; exit 1; fi
            printf '\n' >> /tmp/Caddyfile.new
            cat /tmp/design-block.caddy >> /tmp/Caddyfile.new
            # Файл примонтирован в контейнер: пишем поверх (тот же inode), не mv
            cat /tmp/Caddyfile.new > "$CF"
            echo "backup: $BAK"; diff "$BAK" "$CF" || true
          fi
          if ! docker exec "$C" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
            cat "$BAK" > "$CF"; echo "validate failed, restored $BAK"; exit 1
          fi
          if ! docker exec "$C" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
            cat "$BAK" > "$CF"; docker exec "$C" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || true
            echo "reload failed, restored $BAK"; exit 1
          fi
          echo "$BAK" > /tmp/design-last-backup
          REMOTE

      - name: Smoke check (rollback on regression)
        if: ${{ inputs.mode != 'inspect' }}
        run: |
          sleep 5
          fail=0
          while read -r h code; do
            now=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$h/" || echo ERR)
            echo "$h before=$code now=$now"
            [ "$h" = design.sshorg.com ] && continue
            [ "$now" = "$code" ] || fail=1
          done < before.txt
          d=$(curl -s -o /dev/null -w '%{http_code}' https://design.sshorg.com/); echo "design / -> $d"; [ "$d" = 200 ] || fail=1
          n=$(curl -s -o nf.html -w '%{http_code}' https://design.sshorg.com/no-such-page); echo "design 404 -> $n"
          [ "$n" = 404 ] || fail=1
          grep -q 'Такой страницы нет' nf.html || { echo "404 page body missing"; [ "${{ inputs.mode }}" = rollback ] || fail=1; }
          echo "== headers"; curl -sI https://design.sshorg.com/ | grep -iE 'content-security|x-frame|permissions|cross-origin|cache-control|strict|server' || true
          if [ "$fail" = 1 ] && [ "${{ inputs.mode }}" != rollback ]; then
            echo "regression — rolling back"
            ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_HOST }}" 'B=$(cat /tmp/design-last-backup); cat "$B" > /root/Sartarosh/Caddyfile && docker exec sartarosh-caddy-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile && echo "restored $B"'
            exit 1
          fi
