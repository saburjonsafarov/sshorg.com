name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

      - name: Copy site to server
        run: |
          scp -i ~/.ssh/deploy_key site/* \
            "${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Smoke check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://sshorg.com)
          echo "https://sshorg.com -> $code"
          test "$code" = "200"
